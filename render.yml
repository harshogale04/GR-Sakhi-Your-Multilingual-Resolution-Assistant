services:
  - type: web
    name: maha-gr-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PYTHONPATH
        value: "."
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: "/api/v1"
      - key: SUPABASE_STORAGE_BUCKET
        value: "government-resolutions"
      - key: PINECONE_INDEX_NAME
        value: "maha-gr-index"
      - key: GEMINI_MODEL
        value: "models/gemini-flash-lite-latest"
      - key: GEMINI_EMBEDDING_MODEL
        value: "models/gemini-embedding-001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
